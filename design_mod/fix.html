<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080c10"><title>FORMA — Fix part</title></head>
<body class="showroom-open">
<header><a class="wordmark" href="/">FORMA</a></header>
<main>
<section id="car-picker" aria-label="Vehicle showroom">
  <div class="showroom-space"><div id="vehicle-list" class="showroom-world" role="button" aria-label="Loading cars" tabindex="0"></div><div class="showroom-caption"><div class="car-name"><button id="showroom-previous" class="showroom-arrow" aria-label="Previous car" disabled>←</button><h2 id="showroom-name"></h2><button id="showroom-next" class="showroom-arrow" aria-label="Next car" disabled>→</button></div></div></div>
</section>
<section id="repair-workspace" hidden><div class="work-bar"><button id="change-car">← All cars</button><button id="new-review">Start a new review ↺</button></div><div class="workspace">
<section class="stage" aria-label="Exploded vehicle inspection"><div class="stage-heading"><h2 id="vehicle-title"></h2></div><div id="viewport" aria-label="Interactive vehicle. Drag to orbit and scroll to zoom."></div><div class="empty-state" id="empty-state"><span class="empty-symbol" aria-hidden="true">↗</span><h3 id="empty-title">Loading your car</h3><p id="empty-description">Bringing its surfaces into focus.</p><button id="retry-load" hidden>Try loading again</button></div><div class="part-inspect" id="part-inspect" hidden><span id="part-heading"></span><button id="isolate">Isolate part</button></div><div class="viewer-controls" id="viewer-controls" hidden><div class="control-row"><span id="assembly-state" role="status">Exploded view</span><button id="reset-view">Reset view ↺</button></div><label for="explode">Assembled <output id="explode-value">50%</output> Exploded</label><input id="explode" type="range" min="0" max="100" value="50"><details><summary>Select an exterior part</summary><div id="parts-list" aria-label="Selectable exterior parts"></div></details></div></section>
<section class="conversation" aria-label="Conversation with Astra"><div class="chat-heading"><div><span class="astra-mark" aria-hidden="true">✳</span><h2>Astra</h2></div></div><div id="chat-log" role="log" aria-live="polite" aria-label="Repair conversation"></div><div class="damage-review"><div class="selection-heading"><h3>Parts to review <span id="selected-count">0</span></h3></div><div id="damage-selection"></div><button class="primary" id="confirm-repair" disabled>Confirm & retrieve saved parts ↗</button></div><div id="repair-downloads" hidden></div><div class="composer"><div id="photos" aria-label="Attached damage photos"></div><div class="compose-label"><label for="message-input">Message Astra</label><label class="attach-button" for="damage-photos">＋ Add photos<input id="damage-photos" type="file" multiple accept="image/jpeg,image/png,image/webp" aria-label="Add damage photos"></label></div><textarea id="message-input" rows="3" maxlength="2000" placeholder="Paste a damage photo (Ctrl+V), or tell me what happened…"></textarea><div class="composer-footer"><button id="send-message" class="primary" disabled>Send ↗</button></div></div><p class="working" id="working" role="status" hidden>Astra is reviewing the damage…</p><p class="error" id="chat-error" role="alert" hidden></p></section>
</div></section><p class="error" id="error" role="alert" hidden></p>
</main><script type="module" src="/src/fix.js"></script>
</body></html>
